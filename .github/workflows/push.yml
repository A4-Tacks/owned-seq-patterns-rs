name: push

permissions:
  contents: write

on:
  push:
  pull_request:
  merge_group:

env:
  CARGO_TERM_COLOR: always

jobs:
  upload-assets:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: cargo clippy -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: ''
    steps:
      - uses: actions/checkout@v4
      - run: rm -v Cargo.lock
      - run: |
          ver=$(awk '/rust-version/{gsub(/"/,"");print$3}' Cargo.toml)
          cargo +$ver build   ${{ matrix.features }}
